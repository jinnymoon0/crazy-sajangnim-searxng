use_default_settings: true

general:
  instance_name: "Crazy Sajangnim Search"
  debug: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "CHANGE_WITH_RENDER_ENVIRONMENT_VARIABLE"
  limiter: true
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

ui:
  static_use_hash: true
